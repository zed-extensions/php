id = "php"
name = "PHP"
description = "PHP support."
version = "0.5.4"
schema_version = 1
authors = ["Piotr Osiewicz <piotr@zed.dev>"]
repository = "https://github.com/zed-extensions/php"

[language_servers.phptools]
name = "PhpTools"
languages = ["PHP", "Blade"]
language_ids = { PHP = "php", Blade = "blade" }

[language_servers.intelephense]
name = "Intelephense"
languages = ["PHP", "Blade"]
language_ids = { PHP = "php", Blade = "blade" }

[language_servers.phpactor]
name = "Phpactor"
languages = ["PHP", "Blade"]
language_ids = { PHP = "php", Blade = "blade" }

[language_servers.phpantom]
name = "PHPantom"
languages = ["PHP", "Blade"]
language_ids = { PHP = "php", Blade = "blade" }

[debug_adapters.Xdebug]

[grammars.php]
repository = "https://github.com/tree-sitter/tree-sitter-php"
commit = "5b5627faaa290d89eb3d01b9bf47c3bb9e797dea"
path = "php"

[grammars.phpdoc]
repository = "https://github.com/claytonrcarter/tree-sitter-phpdoc"
